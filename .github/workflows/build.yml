name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Скачивание кода из репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка библиотек
        run: |
          python -m pip install --upgrade pip
          pip install keyboard mouse pyautogui opencv-python pillow pyinstaller

      - name: Сборка EXE файла
        run: |
          pyinstaller --onefile --clean macro.py

      - name: Сохранение готового EXE для скачивания
        uses: actions/upload-artifact@v4
        with:
          name: macro-windows-exe
          path: dist/macro.exe
